name: build-rsb-client-exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build onefile exe with PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --onefile --name rsb_client_py rsb_client.py

      - name: Publish as release (tag: latest)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest dist/rsb_client_py.exe `
            --title "rsb_client_py (auto-built)" `
            --notes "Automatically built from ${{ github.sha }} on windows-latest with PyInstaller onefile. Download: rsb_client_py.exe"
